{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
</head>

<body class="container mt-5">
    <h2 class="text-center text-primary mb-4">📝 My To-Do List</h2>

    <!-- ✅ Add New Task Form -->
    <form method="POST" action="{% url 'add_task' %}" class="d-flex justify-content-center mb-4">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter a task"
               class="form-control w-50 me-2" required>
        <button type="submit" class="btn btn-success">Add</button>
    </form>

    <!-- ✅ Task List -->
    <ul class="list-group">
        {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ task.title }}</span>
                <div>
                    <a href="{% url 'update_task' task.id %}" class="btn btn-sm btn-warning me-2">Edit</a>
                    <a href="{% url 'delete_task' task.id %}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
        {% empty %}
            <li class="list-group-item text-center text-muted">
                No tasks yet 😴
            </li>
        {% endfor %}
    </ul>

</body>
</html>
